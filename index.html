<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Tênis - Catálogo Oficial</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#f8f8f8;color:#111}
  header{background:#111;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
  .logo{font-weight:900;letter-spacing:1px}
  #cart-btn{background:#fff;color:#111;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
  .banner{background:#111;color:#fff;text-align:center;padding:10px;font-size:14px}
  .banner span{color:#25D366;font-weight:bold}
  .container{max-width:1100px;margin:auto;padding:15px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .card img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#fff}
  .card h3{font-size:14px;margin:8px 0 2px}
  .card p{font-size:12px;color:#666}
  .price{font-weight:900;margin:6px 0;color:#111}
  .btn{background:#111;color:#fff;width:100%;border:none;padding:10px;border-radius:10px;cursor:pointer;font-weight:bold}
  .btn-wpp{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:999}
  #cart-modal{position:fixed;top:0;right:-100%;width:90%;max-width:380px;height:100%;background:#fff;transition:.3s;z-index:1001;padding:20px;overflow:auto}
  #cart-modal.open{right:0}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:1000}
  #overlay.show{display:block}
</style>
</head>
<body>

<header>
  <div class="logo">JS TÊNIS</div>
  <button id="cart-btn">🛒 <span id="cart-count">0</span></button>
</header>
<div class="banner">FRETE GRÁTIS Aparecida + <span>10% OFF com cupom JS10</span></div>

<div class="container">
  <div class="grid" id="produtos"></div>
</div>

<a class="btn-wpp" href="https://wa.me/5562982382639?text=Ol%C3%A1%20JS%20T%C3%AAnis!%20Vi%20o%20cat%C3%A1logo%20e%20quero%20comprar" target="_blank">W</a>

<div id="overlay"></div>
<div id="cart-modal">
  <h2>Seu Carrinho</h2><br>
  <div id="cart-items"></div>
  <br><p><strong>Total: R$ <span id="total">0.00</span></strong></p>
  <a id="finalizar" class="btn" style="background:#25D366;text-align:center;display:block;margin-top:12px;text-decoration:none;padding:14px" target="_blank">Finalizar no WhatsApp</a>
  <br><button onclick="fechar()" class="btn" style="background:#eee;color:#111">Continuar comprando</button>
</div>

<script>
const produtos = [
  {id:1,nome:"Olympikus All Black",preco:279.90,tipo:"Esportivo",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=600"},
  {id:2,nome:"Dunk Brown Marrom",preco:329.90,tipo:"Casual",img:"https://images.unsplash.com/photo-1543508282-6319a3e2621f?q=80&w=600"},
  {id:3,nome:"New Balance 530 Branco",preco:349.90,tipo:"Corrida",img:"https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?q=80&w=600"},
  {id:4,nome:"Dunk All Black",preco:299.90,tipo:"Casual",img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=600"},
  {id:5,nome:"NB 530 Preto",preco:349.90,tipo:"Corrida",img:"https://images.unsplash.com/photo-1605348532760-6753d2c43329?q=80&w=600"},
  {id:6,nome:"NB 9060 Bege",preco:379.90,tipo:"Casual",img:"https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=600"}
];
let carrinho=[];
function render(){
  const g=document.getElementById('produtos');
  g.innerHTML='';
  produtos.forEach(p=>{
    g.innerHTML+=`<div class="card"><img src="${p.img}"><h3>${p.nome}</h3><p>${p.tipo}</p><div class="price">R$ ${p.preco.toFixed(2)}</div><button class="btn" onclick="add(${p.id})">COMPRAR</button></div>`;
  })
}
function add(id){carrinho.push(produtos.find(p=>p.id===id));update();document.getElementById('cart-modal').classList.add('open');document.getElementById('overlay').classList.add('show')}
function update(){
  document.getElementById('cart-count').innerText=carrinho.length;
  let t=0;let html='';
  carrinho.forEach(p=>{t+=p.preco;html+=`<p>• ${p.nome} - R$ ${p.preco.toFixed(2)}</p>`});
  document.getElementById('cart-items').innerHTML=html;
  document.getElementById('total').innerText=t.toFixed(2);
  const msg=encodeURIComponent(`Olá JS Tênis! Quero:\n${carrinho.map(p=>`- ${p.nome} R$ ${p.preco.toFixed(2)}`).join('\n')}\n\nTotal: R$ ${t.toFixed(2)}\nCupom: JS10`);
  document.getElementById('finalizar').href=`https://wa.me/5562982382639?text=${msg}`;
}
function fechar(){document.getElementById('cart-modal').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.getElementById('cart-btn').onclick=()=>{document.getElementById('cart-modal').classList.add('open');document.getElementById('overlay').classList.add('show')}
document.getElementById('overlay').onclick=fechar;
render();
</script>
</body>
</html>
